[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-gradu"
version = "0.1.0"
description = "Reproducible classification and survival analyses for heart failure records"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel>=6.29,<7",
  "jupyter>=1.0,<2",
  "nbconvert>=7.16,<8",
]
survival = [
  "pymc>=5.20,<6",
  "arviz>=0.20,<1",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
